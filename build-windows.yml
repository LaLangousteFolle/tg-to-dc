name: Build Windows exe

# Se déclenche sur un tag de version (ex: v1.0.0), ou manuellement depuis l'onglet Actions
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installe les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build l'exe avec PyInstaller
        run: |
          pyinstaller --onefile --console --name tg-to-dc run.py

      - name: Upload l'exe comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-to-dc-windows
          path: dist/tg-to-dc.exe

      - name: Attache l'exe à la release (si déclenché par un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tg-to-dc.exe
